name: Public repo CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-bench-self-test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile x86 hosts and test without vendor DLLs or hardware
        shell: pwsh
        run: |
          foreach ($name in @('SocReadBench','GaugeSurvey','GaugeWatch')) {
            $source = (Resolve-Path "tools/$name.cs").Path
            $exe = Join-Path $env:RUNNER_TEMP "$name.exe"
            & "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /platform:x86 "/out:$exe" $source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe --self-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
      - name: Test bounded object provenance engine
        run: uv run --locked python tools/test_x86_object_flow.py

      - name: Verify MCS-51 bit instruction semantics without firmware
        run: uv run --locked python tools/check_mcs51_bit_logic.py

      - name: Public repository privacy/binary guard
        run: python tools/check_public_repo.py

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Smoke-test analyzer CLIs
        run: |
          python tools/map_osd_atlas.py --help >/dev/null
          python tools/map_osd_text.py --help >/dev/null
          python tools/map_osd_font.py --help >/dev/null
          python tools/map_osd_cells.py --help >/dev/null
          python tools/map_osd_input.py --help >/dev/null
          python tools/map_osd_storage.py --help >/dev/null
          python tools/map_osd_commands.py --help >/dev/null
          python tools/map_osd_handlers.py --help >/dev/null
          python tools/map_osd_language_update.py --help >/dev/null
          python tools/map_osd_language_layout.py --help >/dev/null
          python tools/map_osd_language_list.py --help >/dev/null
          python tools/map_osd_notifications.py --help >/dev/null
          python tools/map_osd_language_set.py --help >/dev/null
          python tools/map_osd_language_refresh.py --help >/dev/null
          python tools/map_osd_overlay_gate.py --help >/dev/null
          python tools/map_osd_overlay_navigation.py --help >/dev/null
          python tools/map_osd_navigation_guards.py --help >/dev/null
          python tools/map_osd_navigation_fallback.py --help >/dev/null
          python tools/map_osd_event09.py --help >/dev/null
          python tools/map_osd_event02.py --help >/dev/null
          python tools/map_osd_clock.py --help >/dev/null
          python tools/map_osd_timer2_setup.py --help >/dev/null
          python tools/map_osd_timer_conversion.py --help >/dev/null
          python tools/map_osd_clock_reset.py --help >/dev/null
          python tools/analyze_banked_abi.py --help >/dev/null
          python tools/analyze_numeric_renderer.py --help >/dev/null
          python tools/analyze_value_provenance.py --help >/dev/null
          python tools/analyze_vcp_dispatch.py --help >/dev/null
          python tools/analyze_ddc_switch_candidates.py --help >/dev/null
          python tools/inspect_wincomm_readmcu.py --help >/dev/null
          python tools/inspect_wincomm_regread.py --help >/dev/null
          python tools/inspect_readregex_vendor_callers.py --help >/dev/null
          python tools/inspect_readregex_dynamic_resolution.py --help >/dev/null
          python tools/soc_recon_campaign.py --help >/dev/null
          python tools/soc_recon_deep.py --help >/dev/null
          python tools/trace_bank12_ddc_candidate.py --help >/dev/null
          python tools/trace_ddc_rx_dispatch.py --help >/dev/null
          python tools/trace_set_vcp_handler.py --help >/dev/null
          python tools/trace_vcp_opcode_switch.py --help >/dev/null
          python tools/trace_ed_charge_state.py --help >/dev/null
          python tools/trace_charge_policy_consumers.py --help >/dev/null
          python tools/trace_charge_policy_callers.py --help >/dev/null
          python tools/trace_charge_policy_sink.py --help >/dev/null
          python tools/trace_charge_bit7_callers.py --help >/dev/null
          python tools/trace_soc_osd_candidates.py --help >/dev/null
          python tools/trace_soc_guards.py --help >/dev/null
          python tools/trace_soc_d833_provenance.py --help >/dev/null
          python tools/trace_soc_f7b2_indirect.py --help >/dev/null
          python tools/trace_soc_be4a_source.py --help >/dev/null
          python tools/trace_vcp_ed_candidate.py --help >/dev/null
          python tools/trace_battery_provenance.py --help >/dev/null
          python tools/trace_battery_proxy.py --help >/dev/null
          python tools/trace_pmic_i2c_candidates.py --help >/dev/null
          python tools/trace_pmic_helper_candidates.py --help >/dev/null
          python tools/trace_pmic_fbfa.py --help >/dev/null
          python tools/trace_typec_hwiic_registers.py --help >/dev/null
          python tools/trace_xdata_fields.py --help >/dev/null
          python tools/run_offline_suite.py --help >/dev/null

      - name: Parse PowerShell tools
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Confirm proprietary firmware is absent
        shell: bash
        run: |
          if git ls-files | grep -Eiq '\.(bin|exe|dll|sfx|rar|zip|dump|rom|flash|hex)$'; then
            echo 'Forbidden proprietary/binary payload is tracked.' >&2
            exit 1
          fi
